server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: "heavencloud.in"
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 3
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 5000
    playerUpdateInterval: 3
    useSeekGhosting: true
    gc-warnings: true

    sources:
      youtube: false       # Disabled — handled by youtube-plugin below
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # OAuth bypass — fixes "Sign in to confirm you're not a bot"
    # Use a BURNER Google account, not your main account!
    oauth:
      enabled: true

    # ANDROID is broken (no fix), WEB_REMIX unresolvable — removed both
    clients:
      - IOS
      - MUSIC
      - WEB
      - TVHTML5_SIMPLY

    IOS:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: true
    MUSIC:
      playback: false
      videoLoading: false
      searching: true
      playlistLoading: false
    WEB:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: true
    TVHTML5_SIMPLY:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: false

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    max-history: 5
    max-size: 10MB
  path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
