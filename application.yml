server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: "heavencloud.in"
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 3
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 5000
    playerUpdateInterval: 3
    useSeekGhosting: true
    gc-warnings: true

    sources:
      youtube: false       # Disabled — handled by youtube-plugin below
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # OAuth bypass — fixes "Sign in to confirm you're not a bot" errors.
    # First run: start Lavalink, copy the printed Google OAuth URL into a browser,
    # sign in with any Google account, then paste the redirect URL back into the console.
    # After that, Lavalink saves the token automatically and this stays enabled.
    oauth:
      enabled: true

    # Client order matters — most reliable first
    clients:
      - ANDROID
      - IOS
      - MUSIC
      - WEB
      - WEB_REMIX

    ANDROID:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: true
    IOS:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: false
    MUSIC:
      playback: false
      videoLoading: false
      searching: true
      playlistLoading: false
    WEB:
      playback: true
      videoLoading: true
      searching: true
      playlistLoading: false
    WEB_REMIX:
      playback: true
      videoLoading: false
      searching: true
      playlistLoading: false

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    max-history: 5
    max-size: 10MB
  path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
