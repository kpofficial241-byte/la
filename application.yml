server:
  port: ${PORT:2333}

lavalink:
  server:
    password: heavencloud.in

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID
      - TVHTML5EMBEDDED
