server: # REST and WS server setup
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube plugin (Mandatory for Lavalink v4 streaming)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
    # LavaSrc plugin for Spotify, Apple Music, Deezer
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.0"

  server:
    password: "youshallnotpass" # Change this to a secure password
    
    # Enable/Disable default audio sources
    sources:
      youtube: false      # Set to false because we use the youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # Audio playback and buffering tuning
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: "LOW"
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    recordingTimeoutSeconds: 0

    # Optional IP Rotation if YouTube rate-limits your IP
    # ipRotation:
    #   ipBlocks: ["1.2.3.4/32"]
    #   strategy: "RotateOnBan"

# Plugin configurations
plugins:
  # Official YouTube Plugin Settings
  youtube:
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients used for fallback if one fails (WEB, MUSIC, TVHTML5, MOBILE, ANDROID_VR)
    clients:
      - MUSIC
      - WEB
      - TVHTML5

  # LavaSrc Plugin Settings (Spotify / Apple Music / Deezer)
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\"" # Resolves exact matches via song's ISRC code
      - "ytmsearch:%QUERY%"  # Falls back to YouTube Music search
      - "ytsearch:%QUERY%"   # Falls back to standard YouTube search
    sources:
      spotify: true
      applemusic: false
      deezer: false
    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID"       # Insert from developer.spotify.com
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET" # Insert from developer.spotify.com
      countryCode: "US"
      playlistLoadLimit: 6                     # Pages to load (100 tracks per page)
      albumLoadLimit: 6                        # Pages to load (50 tracks per page)

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/lavalink.log

  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
